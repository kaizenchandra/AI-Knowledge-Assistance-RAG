services:
  api:
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set a local MinIO user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set a strong local MinIO password}
      S3_ENDPOINT_URL: http://minio:9000
  minio:
    image: ${MINIO_IMAGE:?Set an accessible pinned MinIO-compatible image}
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a local MinIO user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a strong local MinIO password}
    volumes: [minio-data:/data]
volumes:
  minio-data:
